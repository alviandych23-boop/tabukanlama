       <label data-template-id="label-nickname" for="nickname" class="canva-text block mb-2 font-semibold"></label><input id="nickname" name="nama_panggilan" class="field" type="text" maxlength="80" required>
      </div>
      <div>
       <label data-template-id="label-birthplace" for="birthplace" class="canva-text block mb-2 font-semibold"></label><input id="birthplace" name="tempat_lahir" class="field" type="text" maxlength="120" required>
      </div>
      <div>
       <label data-template-id="label-birthdate" for="birthdate" class="canva-text block mb-2 font-semibold"></label><input id="birthdate" name="tanggal_lahir" class="field" type="text" inputmode="numeric" placeholder="DD-MM-YYYY" maxlength="10" required aria-describedby="date-hint">
      </div>
      <div>
       <label data-template-id="label-address" for="address" class="canva-text block mb-2 font-semibold"></label><input id="address" name="alamat" class="field" type="text" placeholder="Contoh: Kampung Kalurae" maxlength="200" required>
      </div>
      <div>
       <label data-template-id="label-school" for="school" class="canva-text block mb-2 font-semibold"></label><input id="school" name="sekolah" class="field" type="text" maxlength="150" required>
       <p data-template-id="school-hint" class="canva-text mt-2 text-sm text-[#526274]"></p>
      </div>
      <div>
       <label data-template-id="label-class" for="classroom" class="canva-text block mb-2 font-semibold"></label><input id="classroom" name="kelas" class="field" type="text" maxlength="50" required>
      </div>
      <div>
       <label data-template-id="label-hobby" for="hobby" class="canva-text block mb-2 font-semibold"></label><input id="hobby" name="hobi" class="field" type="text" maxlength="150" required>
      </div>
      <div>
       <label data-template-id="label-aspiration" for="aspiration" class="canva-text block mb-2 font-semibold"></label><input id="aspiration" name="cita_cita" class="field" type="text" maxlength="150" required>
      </div>
      <div>
       <label data-template-id="label-phone" for="phone" class="canva-text block mb-2 font-semibold"></label><input id="phone" name="nomor_hp" class="field" type="tel" inputmode="numeric" maxlength="20" required>
      </div>
      <div>
       <label data-template-id="label-birth-order" for="birth-order" class="canva-text block mb-2 font-semibold"></label><input id="birth-order" name="anak_ke" class="field" type="number" min="1" max="30" required>
      </div>
      <div>
       <label data-template-id="label-siblings" for="siblings" class="canva-text block mb-2 font-semibold"></label><input id="siblings" name="jumlah_saudara" class="field" type="text" maxlength="50">
       <p data-template-id="siblings-hint" class="canva-text mt-2 text-sm text-[#526274]"></p>
      </div>
      <div>
       <label data-template-id="label-member-church" for="member-church" class="canva-text block mb-2 font-semibold"></label><select id="member-church" name="anggota_induk" class="field" required><option value="" data-template-id="member-church-placeholder" class="canva-text"></option><option value="YA" data-template-id="member-church-yes" class="canva-text"></option><option value="TIDAK" data-template-id="member-church-no" class="canva-text"></option></select>
      </div>
      <div>
       <label data-template-id="label-parent-church" for="parent-church" class="canva-text block mb-2 font-semibold"></label><input id="parent-church" name="jemaat_induk" class="field" type="text" maxlength="180">
      </div>
      <div>
       <label data-template-id="label-age" for="age" class="canva-text block mb-2 font-semibold"></label><input id="age" name="usia" class="field" type="text" inputmode="numeric" maxlength="3" required>
      </div>
      <div class="sm:col-span-2">
       <label data-template-id="label-sidi" for="sidi" class="canva-text block mb-2 font-semibold"></label><select id="sidi" name="calon_sidi" class="field" required><option value="" data-template-id="sidi-placeholder" class="canva-text"></option><option value="YA" data-template-id="sidi-yes" class="canva-text"></option><option value="TIDAK" data-template-id="sidi-no" class="canva-text"></option></select>
      </div>
      <div>
       <label data-template-id="label-father" for="father" class="canva-text block mb-2 font-semibold"></label><input id="father" name="nama_ayah" class="field" type="text" maxlength="120" required>
      </div>
      <div>
       <label data-template-id="label-mother" for="mother" class="canva-text block mb-2 font-semibold"></label><input id="mother" name="nama_ibu" class="field" type="text" maxlength="120" required>
      </div>
     </div>
     <p id="date-hint" data-template-id="date-hint-text" class="canva-text mt-6 text-[#526274]"></p>
     <div class="mt-6 rounded-xl bg-[#f5f1e9] p-4 flex items-start gap-3"><input id="guardian-consent" type="checkbox" class="mt-1 h-5 w-5 accent-[#102947] shrink-0" required> <label data-template-id="consent-label" for="guardian-consent" class="canva-text leading-relaxed"></label>
     </div>
     <p id="form-error" class="hidden mt-5 rounded-lg bg-red-50 p-3 text-[#a13535]" role="alert"></p><button id="review-button" data-template-id="review-button" type="submit" class="canva-button mt-8 w-full rounded-xl bg-[#102947] px-7 py-4 font-bold text-white hover:bg-[#193b5c] transition"></button>
    </form>
   </section>
   <section id="confirm-view" class="view hidden mx-auto max-w-xl px-5 py-16 sm:px-8 text-center" aria-labelledby="confirm-title">
    <div class="rounded-2xl bg-white border border-[#e5e6e5] p-8 sm:p-12 shadow-[0_16px_50px_rgba(16,41,71,.07)]">
     <div class="mx-auto mb-6 h-16 w-16 rounded-full bg-[#f5f1e9] text-[#a67d3c] flex items-center justify-center">
      <i data-lucide="circle-help" aria-hidden="true"></i>
     </div>
     <h2 id="confirm-title" data-template-id="confirm-title" class="canva-text serif font-semibold text-[#102947]"></h2>
     <p data-template-id="confirm-description" class="canva-text mt-4 text-[#526274] leading-relaxed"></p>
     <p id="submit-error" class="hidden mt-5 rounded-lg bg-red-50 p-3 text-[#a13535]" role="alert"></p>
     <div id="sending-status" class="hidden mt-6 items-center justify-center gap-3 text-[#294f76]" role="status">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-[#d7ad63] border-t-[#102947]"></span><span data-template-id="sending-text" class="canva-text"></span>
     </div>
     <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center"><button id="confirm-no" data-template-id="confirm-no-button" type="button" class="canva-button rounded-xl border border-[#bac7d3] px-9 py-3 font-bold text-[#102947] hover:bg-[#f4f7fa]"></button> <button id="confirm-yes" data-template-id="confirm-yes-button" type="button" class="canva-button rounded-xl bg-[#102947] px-9 py-3 font-bold text-white hover:bg-[#193b5c]"></button>
     </div>
    </div>
   </section>
   <section id="success-view" class="view hidden mx-auto max-w-xl px-5 py-16 sm:px-8 text-center" aria-labelledby="success-title">
    <div class="rounded-2xl bg-white border border-[#e5e6e5] p-8 sm:p-12 shadow-[0_16px_50px_rgba(16,41,71,.07)]">
     <div class="check-animate mx-auto mb-7 h-20 w-20 rounded-full bg-[#e9f3ec] text-[#32794c] flex items-center justify-center">
      <i data-lucide="check" aria-hidden="true"></i>
     </div>
     <h2 id="success-title" data-template-id="success-title" class="canva-text serif font-bold text-[#102947]"></h2>
     <p data-template-id="success-thanks" class="canva-text mt-5 font-semibold"></p>
     <p data-template-id="success-message" class="canva-text mt-3 leading-relaxed text-[#526274]"></p>
     <p data-template-id="success-blessing" class="canva-text mt-7 font-bold tracking-wide text-[#9b7234]"></p><button id="success-home" data-template-id="success-home-button" type="button" class="canva-button mt-9 rounded-xl bg-[#102947] px-7 py-4 font-bold text-white hover:bg-[#193b5c]"></button>
    </div>
   </section>
  </main>
  <footer data-template-id="site-footer" class="canva-footer w-full border-t border-[#e5e1d8] px-5 py-6 text-center">
   <p data-template-id="footer-text" class="canva-text text-[#526274]"></p>
  </footer>
  <script>
    const views = {
      landing: document.getElementById('landing'),
      form: document.getElementById('form-view'),
      confirm: document.getElementById('confirm-view'),
      success: document.getElementById('success-view')
    };
    const form = document.getElementById('member-form');
    const reviewButton = document.getElementById('review-button');
    const yesButton = document.getElementById('confirm-yes');
    const noButton = document.getElementById('confirm-no');
    const formError = document.getElementById('form-error');
    const submitError = document.getElementById('submit-error');
    const sendingStatus = document.getElementById('sending-status');
    let ready = false;
    let sending = false;

    function showView(name) {
      Object.entries(views).forEach(([key, node]) => node.classList.toggle('hidden', key !== name));
      window.scrollTo({ top: 0, behavior: 'smooth' });
      const heading = views[name].querySelector('h1, h2');
      if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus({ preventScroll: true }); }
    }
    function showError(element, message) {
      element.textContent = message;
      element.classList.remove('hidden');
    }
    function clearErrors() {
      formError.classList.add('hidden');
      submitError.classList.add('hidden');
      form.querySelectorAll('[aria-invalid="true"]').forEach(el => el.removeAttribute('aria-invalid'));
    }
    function validDate(value) {
      const match = /^(\d{2})-(\d{2})-(\d{4})$/.exec(value);
      if (!match) return false;
      const day = Number(match[1]), month = Number(match[2]), year = Number(match[3]);
      const date = new Date(year, month - 1, day);
      return year >= 1900 && year <= 2026 && date.getFullYear() === year &&
        date.getMonth() === month - 1 && date.getDate() === day;
    }
    function getValidatedData() {
      clearErrors();
      const ids = ['full-name','nickname','birthplace','birthdate','address','school','classroom','hobby','aspiration','phone','birth-order','member-church','age','sidi','father','mother'];
      for (const id of ids) {
        const control = document.getElementById(id);
        if (!control.value.trim()) {
          control.setAttribute('aria-invalid', 'true');
          showError(formError, 'Lengkapi semua kolom bertanda bintang sebelum melanjutkan.');
          control.focus();
          return null;
        }
      }
      const date = document.getElementById('birthdate');
      if (!validDate(date.value.trim())) {
        date.setAttribute('aria-invalid', 'true');
        showError(formError, 'Tanggal lahir harus berupa tanggal yang valid dengan format DD-MM-YYYY.');
        date.focus(); return null;
      }
      const memberChurch = document.getElementById('member-church');
      const parentChurch = document.getElementById('parent-church');
      if (memberChurch.value === 'TIDAK' && !parentChurch.value.trim()) {
        parentChurch.setAttribute('aria-invalid', 'true');
        showError(formError, 'Tuliskan nama jemaat induk Anda saat ini.');
        parentChurch.focus(); return null;
      }
      const age = document.getElementById('age');
      if (!/^\d{1,3}$/.test(age.value.trim()) || Number(age.value) < 1 || Number(age.value) > 120) {
        age.setAttribute('aria-invalid', 'true');
        showError(formError, 'Usia harus berupa angka antara 1 dan 120.');
        age.focus(); return null;
      }
      if (!['YA', 'TIDAK'].includes(document.getElementById('sidi').value)) {
        showError(formError, 'Pilih jawaban calon sidi.'); document.getElementById('sidi').focus(); return null;
      }
      if (!document.getElementById('guardian-consent').checked) {
        showError(formError, 'Pastikan Anda telah memperoleh persetujuan orang tua atau wali.');
        document.getElementById('guardian-consent').focus(); return null;
      }
      return {
        nama_lengkap: document.getElementById('full-name').value.trim(),
        nama_panggilan: document.getElementById('nickname').value.trim(),
        tempat_lahir: document.getElementById('birthplace').value.trim(),
        tanggal_lahir: date.value.trim(),
        alamat: document.getElementById('address').value.trim(),
        sekolah: document.getElementById('school').value.trim(),
        kelas: document.getElementById('classroom').value.trim(),
        hobi: document.getElementById('hobby').value.trim(),
        cita_cita: document.getElementById('aspiration').value.trim(),
        nomor_hp: document.getElementById('phone').value.trim(),
        anak_ke: Number(document.getElementById('birth-order').value),
        jumlah_saudara: document.getElementById('siblings').value.trim(),
        anggota_induk: memberChurch.value,
        jemaat_induk: parentChurch.value.trim(),
        usia: Number(age.value),
        calon_sidi: document.getElementById('sidi').value,
        nama_ayah: document.getElementById('father').value.trim(),
        nama_ibu: document.getElementById('mother').value.trim(),
        created_at: new Date().toISOString()
      };
    }
    function returnHome() {
      if (sending) return;
      form.reset(); clearErrors(); showView('landing');
    }
    document.getElementById('start-button').addEventListener('click', () => showView('form'));
    document.getElementById('back-to-home').addEventListener('click', returnHome);
    document.getElementById('success-home').addEventListener('click', returnHome);
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (getValidatedData()) showView('confirm');
    });
    noButton.addEventListener('click', () => { if (!sending) showView('form'); });
    yesButton.addEventListener('click', async () => {
      if (sending) return;
      const data = getValidatedData();
      if (!data) { showView('form'); return; }
      if (!ready || !navigator.onLine) {
        showError(submitError, 'Data belum terkirim. Periksa koneksi internet dan coba lagi.');
        return;
      }
      sending = true;
      yesButton.disabled = true;
      noButton.disabled = true;
      reviewButton.disabled = true;
      sendingStatus.classList.remove('hidden');
      sendingStatus.classList.add('flex');
      submitError.classList.add('hidden');
      try {
        const result = await window.dataSdk.create(data);
        if (!result.isOk) throw new Error('Penyimpanan gagal');
        form.reset();
        showView('success');
      } catch (_) {
        showError(submitError, 'Data belum berhasil dikirim. Periksa koneksi Anda, lalu coba lagi. Jika masalah berlanjut, hubungi pengurus.');
      } finally {
        sending = false;
        yesButton.disabled = false;
        noButton.disabled = false;
        reviewButton.disabled = false;
        sendingStatus.classList.add('hidden');
        sendingStatus.classList.remove('flex');
      }
    });
    (async () => {
      try {
        const result = await window.dataSdk.init({ onDataChanged() {} });
        ready = result.isOk;
      } catch (_) { ready = false; }
    })();
    if (window.lucide) lucide.createIcons();
  </script>
 </body>
</html>
